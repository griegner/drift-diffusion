[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-diffusion"
version = "0.0.1"
authors = [{name = "Gabriel Riegner", email = "gariegner@ucsd.edu"}]
description = "drift diffusion models of decision making"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autograd>=1.9.1,<2",
    "better-optimize>=0.4.2,<0.5",
    "formulaic>=1.2.2,<2",
    "notebook>=7.6.3,<8",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.6,<4",
    "scikit-learn>=1.9.1,<2",
    "scipy>=1.18.1,<2",
    "statsmodels>=0.15.0,<0.16",
    "ipywidgets>=8.1,<9",
]

[project.optional-dependencies]
code-ocean = [
    "hssm>=0.5.0,<0.6",
    "matplotlib>=3.11.2,<4",
    "seaborn>=0.13.2,<0.14",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["drift_diffusion*"]}}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
# conda dependencies
python = ">=3.12"

[tool.pixi.pypi-dependencies]
# pypi dependencies
drift_diffusion = { path=".", editable=true }
pyddm = ">=0.9.0, <0.10"

[tool.pixi.feature.lint.dependencies]
# matches version in .pre-commit-config.yaml
pre-commit = ">=4.6.2,<5"
black = ">=26.5.1,<27"
ruff = ">=0.16.10,<0.17"
pyupgrade = ">=3.21.2,<4"

[tool.pixi.feature.lint.tasks]
black = { cmd = "black --check --diff drift_diffusion" }
ruff = { cmd = "ruff check --output-format=full drift_diffusion" }
lint = { depends-on = ["black", "ruff"]}

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
py-spy = ">=0.4.2,<0.5"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest -vsl --cov=drift_diffusion --cov-report=xml drift_diffusion" }

[tool.pixi.feature.code-ocean.pypi-dependencies]
drift_diffusion = { path=".", editable=true, extras=["code-ocean"] }

[tool.pixi.environments]
lint = ["lint"]
test = ["test"]
code-ocean = ["code-ocean"]
dev = ["lint", "test", "code-ocean"]

[tool.black]
line-length = 120
target_version = ['py38', 'py39', 'py310']
preview = true
exclude = '''
/(
    \.eggs         # exclude a few common directories in the
  | \.git          # root of the project
  | \.vscode
)/
'''

[tool.ruff]
# max line length for black
line-length = 120
target-version = "py38"
exclude=[
    ".git",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
# all rules can be found here: https://beta.ruff.rs/docs/rules/
select = ["E", "F", "W", "I"]
ignore=[
    # space before : (needed for how black formats slicing)
    "E203",
    # do not assign a lambda expression, use a def
    "E731",
    # do not use variables named 'l', 'O', or 'I'
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# It's fine not to put the import at the top of the file in the examples
# folder.
"examples/*"=["E402"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --color=yes"
doctest_optionflags = "NORMALIZE_WHITESPACE"
